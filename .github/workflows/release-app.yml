name: Release App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Check the signing secrets are configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                      APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secret(s): ${missing[*]}" >&2
            echo "Set them as repository secrets before running this release." >&2
            exit 1
          fi
          echo "All six signing secrets are present."

      - name: Build, sign and notarize
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Verify the app is really signed, not ad-hoc
        run: |
          set -euo pipefail
          app_path="app/src-tauri/target/universal-apple-darwin/release/bundle/macos/dotfix.app"
          info="$(codesign -dv "$app_path" 2>&1)"
          echo "$info"
          if echo "$info" | grep -q "Signature=adhoc"; then
            echo "Refusing to release: $app_path is only ad-hoc signed." >&2
            exit 1
          fi
          if ! echo "$info" | grep -q "^TeamIdentifier="; then
            echo "Refusing to release: $app_path has no TeamIdentifier." >&2
            exit 1
          fi
          if echo "$info" | grep -q "^TeamIdentifier=not set$"; then
            echo "Refusing to release: $app_path's TeamIdentifier is not set." >&2
            exit 1
          fi

      - name: Collect the DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
             "dist/dotfix-${{ inputs.version }}-macos-universal.dmg"
          shasum -a 256 dist/*.dmg | tee dist/checksum.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version }}
          files: |
            dist/*.dmg
            dist/checksum.txt

      # Deferred: NoiXdev/homebrew-tap does not exist yet. Uncomment once it
      # and its bump.yml are in place — see docs/plans/2026-09-16-dotfix-phase-1.md,
      # "Follow-up outside this repository".
