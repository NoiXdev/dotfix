      #     SHA=$(cut -d' ' -f1 dist/checksum.txt)
      #     gh workflow run bump.yml --repo NoiXdev/homebrew-tap \
      #       -f formula=dotfix-app -f version="${{ inputs.version }}" -f sha256="$SHA"
